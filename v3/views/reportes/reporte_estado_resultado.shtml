<!DOCTYPE html>
<html lang="es">
<!--#4DSCRIPT/_V3_proxy-->

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Reporte Estado de Resultado</title>
	<script type="text/javascript" src="/v3/views/reportes/script/content.js"></script>
	<script src="/v3/script/sorttable.js"></script>

	<style>
		:root {
			--col-name: 300px;
			--col-amount: 155px;
			--col-pct: 86px;
			--surface: #ffffff;
			--surface-2: #f8f9fb;
			--surface-3: #eef1f6;
			--border: #dde3ec;
			--border-2: #edf0f5;
			--text: #1e2531;
			--text-2: #5e6e85;
			--text-3: #b0bec5;
			--green: #1a8a4a;
			--green-bg: #eafaf1;
			--green-bd: #a8dfc0;
			--red: #c0392b;
			--red-bg: #fdf3f2;
			--red-bd: #f1b8b3;
			--blue: #2563c7;
			--blue-bg: #eff4ff;
			--blue-bd: #bdd0f7;
			--amber: #b45309;
			--amber-bg: #fffbeb;
			--amber-bd: #fcd68a;
			--yellow-bg: #fef9c3;
			--yellow-text: #854d0e;
			--shadow: 0 4px 24px rgba(30, 37, 49, 0.08);
			--r: 14px;
			--r-sm: 10px;
			--r-xs: 6px;
		}

		section.sheet.items {
			padding: 24px 20px;
			height: auto !important;
		}

		#container-reportes {
			background: var(--surface);
			padding: 28px 24px;
		}

		.er-header {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 16px;
			margin-bottom: 28px;
			flex-wrap: wrap;
		}

		.er-header-left {
			display: flex;
			flex-direction: column;
			gap: 6px;
		}

		.htitle {
			margin: 0;
			font-size: 24px;
			font-weight: 700;
			color: var(--text);
			letter-spacing: -.3px;
			line-height: 1.1;
		}

		.er-subtitle {
			font-size: 13px;
			color: var(--text-2);
		}

		.er-badges {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
			align-items: center;
		}

		.er-badge {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			padding: 6px 14px;
			border-radius: 999px;
			font-size: 12px;
			font-weight: 600;
			border: 1px solid transparent;
		}

		.er-badge::before {
			content: '';
			width: 7px;
			height: 7px;
			border-radius: 50%;
			flex: 0 0 auto;
		}

		.er-badge--v {
			background: var(--green-bg);
			color: var(--green);
			border-color: var(--green-bd);
		}

		.er-badge--v::before {
			background: var(--green);
		}

		.er-badge--c {
			background: var(--red-bg);
			color: var(--red);
			border-color: var(--red-bd);
		}

		.er-badge--c::before {
			background: var(--red);
		}

		.er-badge--r {
			background: var(--blue-bg);
			color: var(--blue);
			border-color: var(--blue-bd);
		}

		.er-badge--r::before {
			background: var(--blue);
		}

		.er-wrap {
			overflow-x: auto;
			border: 1px solid var(--border);
			border-radius: var(--r-sm);
			scrollbar-width: thin;
			scrollbar-color: #c4cdd9 transparent;
		}

		.er-wrap::-webkit-scrollbar {
			height: 5px;
		}

		.er-wrap::-webkit-scrollbar-thumb {
			background: #c4cdd9;
			border-radius: 99px;
		}

		.er-grid {
			display: grid;
			grid-template-columns: var(--col-name) repeat(13, var(--col-amount) var(--col-pct));
			min-width: max-content;
		}

		.er-hdr-concept {
			position: sticky;
			left: 0;
			top: 0;
			z-index: 12;
			background: #1a1a2e;
			color: #fff;
			padding: 14px 20px;
			font-size: 11px;
			font-weight: 700;
			letter-spacing: .8px;
			text-transform: uppercase;
			border-bottom: 2px solid var(--border);
			display: flex;
			align-items: center;
		}

		.er-hdr-month {
			grid-column: span 2;
			position: sticky;
			top: 0;
			z-index: 10;
			background: var(--surface-3);
			color: var(--text-2);
			padding: 14px 12px;
			font-size: 11px;
			font-weight: 700;
			letter-spacing: .5px;
			text-transform: uppercase;
			border-bottom: 2px solid var(--border);
			border-left: 1px solid var(--border-2);
			display: flex;
			align-items: center;
			justify-content: center;
			white-space: nowrap;
		}

		.er-hdr-month.acum {
			background: #e8edf8;
			color: var(--blue);
		}

		.er-section {
			grid-column: 1/-1;
			background: #252d3d;
			color: #fff;
			padding: 12px 20px;
			font-size: 11.5px;
			font-weight: 700;
			letter-spacing: .8px;
			text-transform: uppercase;
			border-left: 4px solid #4a9eff;
		}

		.er-name,
		.er-amt,
		.er-pct {
			display: flex;
			align-items: center;
			min-height: 56px;
			border-bottom: 1px solid var(--border-2);
			transition: background .1s;
		}

		.er-name {
			position: sticky;
			left: 0;
			z-index: 5;
			padding: 14px 20px;
			font-size: 13px;
			font-weight: 600;
			color: var(--text);
			background: var(--surface);
			border-right: 1px solid var(--border-2);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.er-name.v {
			background: var(--green-bg);
			color: var(--green);
			border-left: 3px solid var(--green-bd);
		}

		.er-name.c {
			background: var(--red-bg);
			color: var(--red);
			border-left: 3px solid var(--red-bd);
		}

		.er-name.g {
			background: var(--red-bg);
			color: var(--red);
			border-left: 3px solid var(--red-bd);
		}

		.er-name.sm {
			background: var(--surface-2);
			color: var(--text);
			font-weight: 700;
			border-left: 3px solid #c4cdd9;
		}

		.er-name.sb {
			background: var(--amber-bg);
			color: var(--amber);
			font-weight: 700;
			border-left: 3px solid var(--amber-bd);
		}

		.er-name.rf {
			background: var(--yellow-bg);
			color: var(--yellow-text);
			font-weight: 700;
			border-left: 3px solid #fcd34d;
		}

		.er-amt {
			justify-content: flex-end;
			padding: 0 14px;
			gap: 5px;
			border-left: 1px solid var(--border-2);
			font-size: 13px;
			font-weight: 600;
			color: var(--text);
			font-variant-numeric: tabular-nums;
		}

		.er-amt .sym {
			font-size: 11px;
			font-weight: 500;
			color: var(--text-3);
			flex-shrink: 0;
		}

		.er-amt .val {
			flex: 1;
			text-align: right;
			white-space: nowrap;
		}

		.er-amt.sm {
			background: var(--surface-2);
			font-weight: 700;
		}

		.er-amt.sb {
			background: var(--amber-bg);
			color: var(--amber);
			font-weight: 700;
			border-bottom-color: var(--amber-bd);
		}

		.er-amt.rf {
			background: var(--yellow-bg);
			color: var(--yellow-text);
			font-weight: 700;
			min-height: 58px;
			border-top: 2px solid #fcd34d;
		}

		.er-pct {
			justify-content: flex-end;
			padding: 0 12px;
			gap: 3px;
			border-left: 1px solid var(--border-2);
			font-size: 12.5px;
			font-weight: 500;
			color: var(--text-2);
			font-variant-numeric: tabular-nums;
		}

		.er-pct .pv {
			white-space: nowrap;
		}

		.er-pct .ps {
			font-size: 11px;
			color: var(--text-3);
		}

		.er-pct.sm {
			background: var(--surface-2);
			font-weight: 700;
		}

		.er-pct.sb {
			background: var(--amber-bg);
			color: var(--amber);
			font-weight: 700;
			border-bottom-color: var(--amber-bd);
		}

		.er-pct.rf {
			background: var(--yellow-bg);
			color: var(--amber);
			font-weight: 600;
			min-height: 58px;
			border-top: 2px solid #fcd34d;
		}

		.neg {
			color: var(--red) !important;
		}

		.pos {
			color: var(--green) !important;
		}

		.er-dbtn {
			width: 22px;
			height: 22px;
			min-width: 22px;
			border-radius: 5px;
			border: 1px solid var(--blue-bd);
			background: var(--blue-bg);
			color: var(--blue);
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all .14s;
			flex-shrink: 0;
			margin-left: 4px;
		}

		.er-dbtn svg {
			width: 11px;
			height: 11px;
			fill: currentColor;
			display: block;
		}

		.er-dbtn:hover {
			background: var(--blue);
			color: #fff;
			border-color: var(--blue);
			transform: translateY(-1px);
			box-shadow: 0 2px 6px rgba(37, 99, 199, .3);
		}

		.er-dbtn:disabled {
			opacity: 0;
			pointer-events: none;
		}

		[data-rid].hov {
			background: #f0f5ff !important;
		}

		.er-name.v[data-rid].hov {
			background: #d4f5e5 !important;
		}

		.er-name.c[data-rid].hov,
		.er-name.g[data-rid].hov {
			background: #fde0de !important;
		}

		.er-name.sm[data-rid].hov {
			background: #eaecf2 !important;
		}

		.er-name.sb[data-rid].hov {
			background: #fef0c0 !important;
		}

		.er-amt.sb[data-rid].hov,
		.er-pct.sb[data-rid].hov {
			background: #fef3c7 !important;
		}

		.er-name.rf[data-rid].hov,
		.er-amt.rf[data-rid].hov,
		.er-pct.rf[data-rid].hov {
			background: #fef08a !important;
		}

		.er-empty {
			grid-column: 1/-1;
			padding: 48px 20px;
			text-align: center;
			color: var(--text-2);
			font-size: 13px;
		}

		#search {
			display: inline-block;
			margin: 18px 0 0 0;
		}

		#search input[name="estado_compras"] {
			width: 135px !important;
		}

		li[data-name="exit"] {
			top: 10px;
			left: 0;
			position: absolute;
		}

		.er-modal-backdrop {
			position: fixed;
			inset: 0;
			background: rgba(15, 20, 35, .5);
			backdrop-filter: blur(4px);
			display: none;
			align-items: center;
			justify-content: center;
			padding: 20px;
			z-index: 9999;
		}

		.er-modal-backdrop.open {
			display: flex;
		}

		.er-modal {
			width: min(1220px, 100%);
			max-height: 90vh;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--r);
			box-shadow: 0 24px 64px rgba(15, 20, 35, .18);
			overflow: hidden;
			display: flex;
			flex-direction: column;
			animation: mIn .18s ease;
		}

		@keyframes mIn {
			from {
				opacity: 0;
				transform: translateY(10px) scale(.98)
			}

			to {
				opacity: 1;
				transform: none
			}
		}

		.er-modal-hdr {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 16px;
			padding: 18px 22px;
			border-bottom: 1px solid var(--border);
			background: var(--surface-2);
		}

		.er-modal-title {
			font-size: 17px;
			font-weight: 700;
			color: var(--text);
		}

		.er-modal-sub {
			font-size: 12px;
			color: var(--text-2);
			line-height: 1.55;
			margin-top: 4px;
		}

		.er-modal-sub strong {
			color: var(--text);
		}

		.er-modal-close {
			border: 1px solid var(--border);
			background: var(--surface);
			color: var(--text-2);
			width: 34px;
			height: 34px;
			border-radius: var(--r-xs);
			font-size: 18px;
			cursor: pointer;
			transition: all .13s;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.er-modal-close:hover {
			background: var(--red-bg);
			color: var(--red);
			border-color: var(--red-bd);
		}

		.er-modal-body {
			padding: 18px 22px 22px;
			overflow: auto;
			scrollbar-width: thin;
			scrollbar-color: #c4cdd9 transparent;
		}

		.er-loading,
		.er-error,
		.er-empty-state {
			padding: 28px 20px;
			text-align: center;
			border: 1px dashed #c4cdd9;
			border-radius: var(--r-sm);
			background: var(--surface-2);
			color: var(--text-2);
			font-size: 13px;
		}

		.er-error {
			border-color: var(--red-bd);
			background: var(--red-bg);
			color: var(--red);
		}

		.er-kpi-grid {
			display: grid;
			grid-template-columns: repeat(4, minmax(130px, 1fr));
			gap: 10px;
			margin-bottom: 16px;
		}

		.er-kpi {
			border: 1px solid var(--border);
			border-radius: var(--r-sm);
			padding: 12px 14px;
			background: var(--surface-2);
		}

		.er-kpi-lbl {
			font-size: 10.5px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: .5px;
			color: var(--text-2);
			margin-bottom: 6px;
		}

		.er-kpi-val {
			font-size: 17px;
			font-weight: 700;
			color: var(--text);
			word-break: break-word;
		}

		.er-dtbl-wrap {
			overflow: auto;
			border: 1px solid var(--border);
			border-radius: var(--r-sm);
		}

		.er-dtbl {
			width: 100%;
			border-collapse: collapse;
			min-width: 860px;
		}

		.er-dtbl th,
		.er-dtbl td {
			padding: 10px 13px;
			border-bottom: 1px solid var(--border-2);
			font-size: 12px;
			text-align: left;
		}

		.er-dtbl thead th {
			background: var(--surface-3);
			position: sticky;
			top: 0;
			z-index: 1;
			font-weight: 700;
			font-size: 11px;
			text-transform: uppercase;
			letter-spacing: .4px;
			color: var(--text-2);
		}

		.er-dtbl td.r,
		.er-dtbl th.r {
			text-align: right;
		}

		.er-dtbl tbody tr:hover {
			background: var(--surface-2);
		}

		.er-folio {
			display: inline-block;
			padding: 3px 9px;
			border-radius: 999px;
			background: var(--blue-bg);
			color: var(--blue);
			font-weight: 700;
			font-size: 11px;
			border: 1px solid var(--blue-bd);
		}

		@media(max-width:980px) {
			section.sheet.items {
				padding: 10px
			}

			#container-reportes {
				padding: 14px;
				border-radius: 10px
			}

			.htitle {
				font-size: 19px
			}

			.er-kpi-grid {
				grid-template-columns: repeat(2, 1fr)
			}

			:root {
				--col-name: 200px;
				--col-amount: 130px;
				--col-pct: 70px
			}
		}

		@media(max-width:640px) {
			.htitle {
				font-size: 17px
			}

			.er-kpi-grid {
				grid-template-columns: 1fr 1fr
			}

			.er-modal-backdrop {
				padding: 8px
			}

			.er-modal {
				border-radius: 12px;
				max-height: 95vh
			}

			.er-modal-hdr,
			.er-modal-body {
				padding-left: 14px;
				padding-right: 14px
			}

			:root {
				--col-name: 160px;
				--col-amount: 110px;
				--col-pct: 60px
			}
		}
	</style>

	<script>
		(function () {
			'use strict';

			var MONTHS = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre', 'Acumulado'];
			var PENCIL = '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm2.92 2.33H5v-.92l9.06-9.06.92.92L5.92 19.58zM20.71 7.04a1.003 1.003 0 0 0 0-1.42L18.37 3.29a1.003 1.003 0 0 0-1.42 0l-1.13 1.13 3.75 3.75 1.14-1.13z"/></svg>';

			/* ── STATE ── */
			var data = null;
			var cc = null;

			/* ── DOM refs (se asignan en init) ── */
			var gridEl, backdropEl, modalTitleEl, modalSubEl, modalBodyEl;

			/* ── INIT ── */
			function init() {
				gridEl = document.getElementById('er-grid');
				backdropEl = document.getElementById('er-modal-backdrop');
				modalTitleEl = document.getElementById('er-modal-title');
				modalSubEl = document.getElementById('er-modal-sub');
				modalBodyEl = document.getElementById('er-modal-body');

				bindUI();

				unaBase.toolbox.init();

				unaBase.toolbox.search.init({
					callback: function () {
						fetch();
						return false;
					},
					inflection: { singular: 'categoria', plural: 'categorias', none: 'ninguna' },
					filters: [
						{ name: 'date_from', type: 'year', caption: 'Año', currentYear: true },
						{ name: 'area_negocio_reporte', type: 'autocomplete', caption: 'Área de negocio', dataSource: 'getAreaNegocio' },
						{ name: 'estado_compras', type: 'autocomplete', caption: 'Estado de las compras', dataObject: [{ text: 'Abiertas para compras' }, { text: 'Cerradas para compras' }] },
						{ name: 'tipo_moneda', type: 'autocomplete', caption: 'Tipo moneda', dataObject: [{ text: 'PEN' }, { text: 'USD' }] },
						{ name: 'estado', type: 'checkbox', caption: 'Estado del documento', options: [{ caption: 'Por gastar', name: 'por_gastar', value: true }] },
						{ name: 'factura', type: 'checkbox', caption: 'Solo facturas', options: [{ caption: 'Desde facturado', name: 'solo_facturas', value: false }] }
					],
					hideSearchBox: true
				});

				unaBase.toolbox.menu.init({
					entity: 'estado_resultados',
					buttons: ['exit', 'export_list']
				});

				/* hide tipo_moneda filter */
				var tm = document.querySelector('#search input[name="tipo_moneda"]');
				if (tm) { var lbl = tm.closest('label.autocomplete'); if (lbl) lbl.style.display = 'none'; }
			}

			/* ── BIND UI ── */
			function bindUI() {
				/* modal close */
				document.addEventListener('click', function (e) {
					if (e.target === backdropEl || e.target.closest('#er-modal-close')) closeModal();
				});
				document.addEventListener('keydown', function (e) {
					if (e.key === 'Escape') closeModal();
				});

				/* row hover via data-rid */
				document.addEventListener('mouseover', function (e) {
					var el = e.target.closest('[data-rid]');
					if (!el) return;
					document.querySelectorAll('[data-rid="' + el.dataset.rid + '"]').forEach(function (c) { c.classList.add('hov'); });
				});
				document.addEventListener('mouseout', function (e) {
					var el = e.target.closest('[data-rid]');
					if (!el) return;
					document.querySelectorAll('[data-rid="' + el.dataset.rid + '"]').forEach(function (c) { c.classList.remove('hov'); });
				});
			}

			/* ── FETCH reporte ── */
			function fetch() {
				var params = $.param(unaBase.toolbox.search.advancedFilter || {}) + '&' + $('#search').serializeAnything(true);
				unaBase.ui.block();
				$('#search').find('*').prop('disabled', true);

				$.ajax({
					url: '/4DACTION/_V3_getEstadoResultadoReporte',
					data: params,
					dataType: 'json',
					success: function (res) {
						data = res || {};
						cc = resolveCurrency(res);
						renderGrid();
						unaBase.ui.unblock();
						$('#search').find('*').prop('disabled', false);
					},
					error: function () {
						gridEl.innerHTML = '<div class="er-empty">No fue posible cargar el reporte.</div>';
						unaBase.ui.unblock();
						$('#search').find('*').prop('disabled', false);
					}
				});
			}

			/* ── CURRENCY ── */
			function resolveCurrency(res) {
				var c = res && res.currency;
				return {
					code: c ? (c.code || currency.code) : currency.code,
					symbol: c ? (c.symbol || currency.symbol) : currency.symbol,
					decimals: c ? (c.decimal != null ? c.decimal : currency.decimals) : currency.decimals,
					dec_sep: c ? (c.decimal_sep || currency.decimals_sep) : currency.decimals_sep,
					thou_sep: c ? (c.thousand_sep || currency.thousands_sep) : currency.thousands_sep
				};
			}

			/* ── RENDER GRID ── */
			function renderGrid() {
				var d = data;
				var html = '';

				/* VENTAS */
				var vRows = '';
				((d.ventas && d.ventas.areas_negocio) || []).forEach(function (item, i) {
					if (!hasVal(item.months)) return;
					vRows += buildRow(item.name, item.months, 'v', 'v' + i, false, '');
				});
				if (vRows) {
					html += '<div class="er-section">Venta por área de negocio</div>' + vRows;
					html += buildSumRow('Suma ventas', (d.ventas && d.ventas.suma ? d.ventas.suma.months : []), 'sm');
				}

				/* COSTOS DIRECTOS */
				((d.costos_directos && d.costos_directos.tipos) || []).forEach(function (item, i) {
					if (!hasVal(item.months)) return;
					html += buildRow(item.name, item.months, 'c', 'cd' + i, false, '');
				});

				/* POR GASTAR */
				((d.por_gastar && d.por_gastar.tipos) || []).forEach(function (item, i) {
					if (!hasVal(item.months)) return;
					html += buildRow(item.name, item.months, 'c', 'pg' + i, false, '');
				});

				/* RESULTADO OPERACIÓN */
				html += buildSumRow('Resultado operación', (d.resultado_operacion ? d.resultado_operacion.months : []) || [], 'sb');

				/* GASTOS GENERALES */
				var gRows = '';
				((d.gastos_generales && d.gastos_generales.clasificaciones) || []).forEach(function (item, i) {
					if (!hasVal(item.months)) return;
					gRows += buildRow(item.name, item.months, 'g', 'g' + i, true, 'Gastos generales');
				});
				if (gRows) {
					html += '<div class="er-section">Gastos generales</div>' + gRows;
					html += buildSumRow('Suma gastos generales', (d.gastos_generales && d.gastos_generales.suma ? d.gastos_generales.suma.months : []), 'sm');
				}

				/* RESULTADO FINAL */
				html += buildSumRow('Resultado final', (d.resultado ? d.resultado.months : []) || [], 'rf');

				gridEl.innerHTML = html || '<div class="er-empty">No hay información para los filtros seleccionados.</div>';
			}

			/* ── ROW BUILDERS ── */
			function buildRow(name, months, cls, rid, allowDetail, section) {
				var safe = esc(name || 'Sin nombre');
				var h = '<div class="er-name ' + cls + '" data-rid="' + rid + '" title="' + safe + '">' + safe + '</div>';

				/* consolidar todas las oc_ids de todos los meses en un solo string */
				var allIds = [];
				if (allowDetail) {
					(months || []).forEach(function (m) {
						String((m && m.oc_ids) || '').split(';').forEach(function (id) {
							id = id.trim();
							if (id && allIds.indexOf(id) === -1) allIds.push(id);
						});
					});
				}
				var allIdsStr = allIds.join(';');

				(months || []).forEach(function (m, i) {
					h += buildAmtCell(m, i + 1, cls, rid, allowDetail, name, section, allIdsStr);
					h += buildPctCell(m, cls, rid);
				});
				return h;
			}

			function buildSumRow(label, months, cls) {
				var rid = 'sr-' + cls + '-' + label.replace(/\W+/g, '-');
				var h = '<div class="er-name ' + cls + '" data-rid="' + rid + '">' + esc(label) + '</div>';
				(months || []).forEach(function (m, i) {
					h += buildAmtCell(m, i + 1, cls, rid, false, label, '', '');
					h += buildPctCell(m, cls, rid);
				});
				return h;
			}

			function buildAmtCell(m, idx, cls, rid, allowDetail, rowName, section, allIdsStr) {
				var raw = n(m && m.value);
				var disp = money(raw);
				var vc = (cls !== 'c' && cls !== 'g') ? (raw < 0 ? ' neg' : (raw > 0 ? ' pos' : '')) : '';
				var ocIds = (m && m.oc_ids) ? String(m.oc_ids) : '';
				var canOpen = !!(allowDetail && ocIds.trim());

				var btn = '<button type="button" class="er-dbtn"'
					+ (canOpen ? ' onclick="openDetail(this);event.stopPropagation()"' : ' disabled')
					+ ' data-mn="' + idx + '"'
					+ ' data-mname="' + esc(MONTHS[idx - 1] || '') + '"'
					+ ' data-rname="' + esc(rowName || '') + '"'
					+ ' data-sname="' + esc(section || '') + '"'
					+ ' data-oids="' + esc(ocIds) + '"'
					+ ' data-all-oids="' + esc(allIdsStr || '') + '"'
					+ ' data-monto="' + esc(String(raw)) + '"'
					+ '>' + PENCIL + '</button>';

				return '<div class="er-amt ' + cls + vc + ' m' + idx + '" data-rid="' + rid + '" data-raw="' + raw + '">'
					+ '<span class="sym">' + disp.sym + '</span>'
					+ '<span class="val">' + disp.amt + '</span>'
					+ btn
					+ '</div>';
			}

			function buildPctCell(m, cls, rid) {
				var raw = n(m && m.percent);
				var val = (raw * 100).toFixed(2).replace('.', ',');
				var vc = raw < 0 ? ' neg' : '';
				return '<div class="er-pct ' + cls + vc + '" data-rid="' + rid + '">'
					+ '<span class="pv">' + val + '</span>'
					+ '<span class="ps">%</span>'
					+ '</div>';
			}

			/* ── DETAIL MODAL ── */
			function openDetail(btn) {
				var mname = btn.dataset.mname || '';
				var rname = btn.dataset.rname || '';
				var sname = btn.dataset.sname || '';
				var amount = n(btn.dataset.monto);
				var ids = (btn.dataset.oids || '').trim();

				modalTitleEl.textContent = 'Detalle del gasto';
				modalSubEl.innerHTML = '<strong>Sección:</strong> ' + esc(sname)
					+ ' &nbsp;&nbsp; <strong>Clasificación:</strong> ' + esc(rname)
					+ ' &nbsp;&nbsp; <strong>Mes:</strong> ' + esc(mname);
				modalBodyEl.innerHTML = '<div class="er-loading">Cargando detalle de órdenes...</div>';
				backdropEl.classList.add('open');

				$.ajax({
					url: '/4DACTION/_force_getOrdenesById',
					method: 'GET',
					dataType: 'json',
					data: { oc_ids: ids, ids: ids },
					success: function (r) { renderDetail(r, { mname: mname, rname: rname, sname: sname, amount: amount }); },
					error: function () { modalBodyEl.innerHTML = '<div class="er-error">No fue posible obtener el detalle.</div>'; }
				});
			}

			function closeModal() { backdropEl.classList.remove('open'); }

			function renderDetail(response, meta) {
				var rows = normalizeRows(response);
				debugger
				var total = sumAmt(rows);
				var kpis = buildKpis(meta, total, rows.length);

				if (!rows.length) {
					modalBodyEl.innerHTML = kpis + '<div class="er-empty-state">No se encontraron órdenes para mostrar.</div>';
					return;
				}

				var trs = rows.map(function (item) {
					var idOc = f(item, ['id_o_compra', 'id', 'ID', '_id', 'oc_id']);
					var folio = f(item, ['folio_oc', 'Folio', 'numero', 'number']) || '-';
					var href = window.location.origin + '/4DACTION/wbienvenidos#compras/content.shtml?id=' + encodeURIComponent(idOc);

					return '<tr>'
						+ '<td><a class="er-folio" href="' + esc(href) + '" target="_blank">' + esc(folio) + '</a></td>'
						+ '<td>' + esc(f(item, ['razon_proveedor']) || '-') + '</td>'
						+ '<td>' + esc(f(item, ['referencia']) || '-') + '</td>'
						+ '<td>' + esc(f(item, ['fecha', 'date', 'createdAt', 'document_date']) || '-') + '</td>'
						+ '<td class="r">' + esc(fmt(pickAmt(item))) + '</td>'
						+ '</tr>';
				}).join('');

				modalBodyEl.innerHTML = kpis
					+ '<div class="er-dtbl-wrap"><table class="er-dtbl">'
					+ '<thead><tr><th>Folio</th><th>Proveedor</th><th>Detalle</th><th>Fecha</th><th class="r">Monto</th></tr></thead>'
					+ '<tbody>' + trs + '</tbody></table></div>';
			}

			function buildKpis(meta, total, count) {
				var tb = total !== null
					? '<div class="er-kpi"><div class="er-kpi-lbl">Suma detalle</div><div class="er-kpi-val">' + esc(fmt(total)) + '</div></div>'
					: '<div class="er-kpi"><div class="er-kpi-lbl">Suma detalle</div><div class="er-kpi-val">—</div></div>';
				return '<div class="er-kpi-grid">'
					+ '<div class="er-kpi"><div class="er-kpi-lbl">Mes</div><div class="er-kpi-val">' + esc(meta.mname) + '</div></div>'
					+ '<div class="er-kpi"><div class="er-kpi-lbl">Clasificación</div><div class="er-kpi-val">' + esc(meta.rname) + '</div></div>'
					+ '<div class="er-kpi"><div class="er-kpi-lbl">Monto del reporte</div><div class="er-kpi-val">' + esc(fmt(meta.amount)) + '</div></div>'
					+ '<div class="er-kpi"><div class="er-kpi-lbl">Órdenes encontradas</div><div class="er-kpi-val">' + count + '</div></div>'
					+ tb + '</div>';
			}

			/* ── HELPERS ── */
			function normalizeRows(r) {
				if (Array.isArray(r)) return r;
				if (r && Array.isArray(r.rows)) return r.rows;
				if (r && Array.isArray(r.data)) return r.data;
				if (r && r.data && Array.isArray(r.data.rows)) return r.data.rows;
				if (r && Array.isArray(r.items)) return r.items;
				if (r && Array.isArray(r.result)) return r.result;
				return [];
			}

			function sumAmt(rows) {
				var t = 0;
				var found = false;

				rows.forEach(function (r) {
					var a = pickAmt(r);
					if (a !== null) {
						found = true;
						t += a;
					}
				});

				return found ? t : null;
			}

			function pickAmt(item) {
				var keys = ['total_exento', 'total_neto', 'total_adicional'];
				if (item.id_tipo_gasto == "FXR") {
					keys = ['total_justificado'];
				}

				var total = 0;
				var found = false;

				for (var i = 0; i < keys.length; i++) {
					if (item[keys[i]] != null && item[keys[i]] !== '') {
						total += n(item[keys[i]]);
						found = true;
					}
				}

				return found ? total : null;
			}

			function f(item, keys) {
				for (var i = 0; i < keys.length; i++) {
					if (item[keys[i]] != null && item[keys[i]] !== '') return item[keys[i]];
				}
				return '';
			}

			function hasVal(months) {
				return (months || []).some(function (m) { return n(m.value) !== 0; });
			}

			function money(val) {
				var v = n(val), sym = cc.symbol;
				if (data.moneda && data.moneda !== '' && data.moneda !== cc.code) {
					sym = data.moneda;
					v = v / n(data.valor_cambio || 1);
				}
				return { sym: sym, amt: $.number(v, cc.decimals, cc.dec_sep, cc.thou_sep) };
			}

			function fmt(val) {
				return $.number(n(val), cc.decimals, cc.dec_sep, cc.thou_sep);
			}

			function n(v) {
				if (typeof v === 'number') return isNaN(v) ? 0 : v;
				var t = String(v == null ? '0' : v).trim();
				if (!t) return 0;
				var r = parseFloat(t.replace(/\s+/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'));
				return isNaN(r) ? 0 : r;
			}

			function esc(v) {
				return String(v == null ? '' : v)
					.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
					.replace(/"/g, '&quot;').replace(/'/g, '&#039;');
			}

			/* ── EXPONER solo lo que necesita el HTML inline ── */
			window.openDetail = openDetail;
			window.updateCambio = function (monthIdx, newVal) {
				var cambio = parseFloat(String(newVal || '0').replace(',', '.'));
				if (!cambio || isNaN(cambio)) return;
				document.querySelectorAll('.m' + monthIdx).forEach(function (el) {
					var raw = parseFloat(el.dataset.raw) || 0;
					var valEl = el.querySelector('.val');
					if (valEl) valEl.textContent = $.number(raw / cambio, cc.decimals, cc.dec_sep, cc.thou_sep);
				});
			};

			$(document).ready(function () { init(); });

		})();
	</script>
</head>

<body>
	<section class="sheet items">
		<div id="container-reportes">

			<div class="er-header">
				<div class="er-header-left">
					<h3 class="htitle">Estado de resultado</h3>
					<div class="er-subtitle">Vista anual por mes, acumulado y detalle de gastos</div>
				</div>
				<div class="er-badges">
					<span class="er-badge er-badge--v">Ventas</span>
					<span class="er-badge er-badge--c">Costos / Gastos</span>
					<span class="er-badge er-badge--r">Resultado</span>
				</div>
			</div>

			<div class="er-wrap">
				<div class="er-grid">
					<div class="er-hdr-concept">Concepto</div>
					<div class="er-hdr-month">Enero</div>
					<div class="er-hdr-month">Febrero</div>
					<div class="er-hdr-month">Marzo</div>
					<div class="er-hdr-month">Abril</div>
					<div class="er-hdr-month">Mayo</div>
					<div class="er-hdr-month">Junio</div>
					<div class="er-hdr-month">Julio</div>
					<div class="er-hdr-month">Agosto</div>
					<div class="er-hdr-month">Septiembre</div>
					<div class="er-hdr-month">Octubre</div>
					<div class="er-hdr-month">Noviembre</div>
					<div class="er-hdr-month">Diciembre</div>
					<div class="er-hdr-month acum">Acumulado</div>
					<div id="er-grid" style="display:contents;">
						<div class="er-empty">Cargando datos...</div>
					</div>
				</div>
			</div>

		</div>
	</section>

	<div class="er-modal-backdrop" id="er-modal-backdrop">
		<div class="er-modal" role="dialog" aria-modal="true">
			<div class="er-modal-hdr">
				<div>
					<div class="er-modal-title" id="er-modal-title">Detalle</div>
					<div class="er-modal-sub" id="er-modal-sub">Cargando...</div>
				</div>
				<button type="button" class="er-modal-close" id="er-modal-close" aria-label="Cerrar">×</button>
			</div>
			<div class="er-modal-body" id="er-modal-body"></div>
		</div>
	</div>
</body>
