<!DOCTYPE html>
<html>

<head>
  <title>Reporte costo</title>
  <script>

    function downloadReport () {
      const dateFrom = document.getElementById('report_date').value
      const dateTo = ''
      if (dateFrom == '') {
        toastr.warning("Debes indicar una fecha");
        return;
      }
      var url = nodeUrl + '/export-cost-report-custom/?download=true&entity=cotizaciones&id=' + $('section.sheet').data('id') + '&folio=' + (($('#main-container').data('index') > 0) ? $('#main-container').data('index') : 'S/N') + '&sid=' + unaBase.sid.encoded() + '&preview=false&nullified=' + $('section.sheet').data('readonly') + '&from=' + dateFrom + "&to=" + dateTo + "&company=" + companyName;
      url = url + '&hostname=' + window.location.origin;
      var download = window.open(url).blur();
      window.focus();
      download.close();



    }


    const dateInput = document.getElementById('report_date');
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    const formattedDate = `${year}-${month}-${day}`;
    dateInput.value = formattedDate;
  </script>


  <style>
    /* Estilo general del modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 2;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.5);
    }

    /* Contenido del modal */
    .modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 20px;
      border-radius: 5px;
      width: 80%;
      border: none;
    }

    /* Cabecera del modal */
    .modal-header {
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      margin: 0;
    }

    /* Botón de cerrar */
    .close {
      font-size: 1.5em;
      cursor: pointer;
    }

    /* Cuerpo del modal */
    .modal-body {
      padding-top: 20px;
    }

    .date-range {
      display: flex;
      justify-content: center;
    }

    .date-picker {
      display: flex;
      flex-direction: column;
    }

    input[type="date"] {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
      margin-top: 5px;
    }

    /* Opciones de exportación */
    .export-options {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .export-btn {
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background-color: #F1F9F8;
      border: 1px solid transparent;
      transition: 0.5s;
    }

    .export-btn:not([disabled]) {
      color: #6F7272;
    }

    .export-btn:not([disabled]):hover {
      color: #6F7272;
      transition: 0.5s;
      background-color: white;
      border: 1px solid #2DAC90;
    }

    .export-btn i {
      color: #6F7272;
      margin-right: 3px;
    }

    /* Pie de página del modal */
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .footer-btn {
      padding: 10px 15px;
      margin-left: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .cancel {
      background-color: #f0f0f0;
    }

    .continue {
      background-color: #4CAF50;
      color: white;
    }
  </style>
</head>

<body>
  <div class="modal-content">
    <div class="modal-body">
      <form>
        <div class="date-range">
          <div class="date-picker">
            <label for="desde">Fecha:</label>
            <input type="date" id="report_date" name="desde">
          </div>
        </div>

        <div class="export-options">
          <button type="button" class="export-btn" disabled>Descargar PDF</button>
          <button type="button" class="export-btn" onclick="downloadReport()"><i class="fas fa-download"></i>Descargar
            Excel</button>
        </div>

      </form>
    </div>
  </div>
</body>

</html>
