<!DOCTYPE html>
<html>
  <!--#4DSCRIPT/_V3_proxy-->
  <head>
    <title>Reporte cuentas por cobrar y pagar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Mantengo tu sorttable si lo ocupas en otros lados -->
    <script src="/v3/script/sorttable.js"></script>

    <style>
      /* ===================== UNA-Base Report — UB 2025 (Light Only) ===================== */
      :root {
        color-scheme: light;

        --ub-bg: #ffffff;
        --ub-bg-soft: #f7f8fb;
        --ub-card: #ffffff;
        --ub-text: #121417;
        --ub-text-soft: #5b6168;
        --ub-border: #e6e8ef;
        --ub-accent: #70DC5B;   /* azul refine */
        --ub-ok: #16a34a;       /* verde */
        --ub-warn: #eab308;     /* amarillo */
        --ub-bad: #dc2626;      /* rojo */

        --ub-radius-lg: 16px;
        --ub-radius-md: 12px;
        --ub-radius-sm: 8px;

        --ub-shadow-sm: 0 1px 2px rgba(0,0,0,.06);
        --ub-shadow-md: 0 6px 18px rgba(2, 6, 23, 0.08);
        --ub-shadow-lg: 0 16px 40px rgba(2, 6, 23, 0.12);

        --ub-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial;
      }

      /* Contenedor principal (no se toca body) */
      #container-reportes {
        background: var(--ub-bg);
        color: var(--ub-text);
        font-family: var(--ub-font);
        padding: 16px;
        width: 100%;
        max-width: 100%;
        min-height: calc(100vh - 80px);
        overflow-x: hidden;
        overflow-y: auto;
        box-sizing: border-box;
      }

      /* Header */
      .ub-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .ub-title {
        font-weight: 700;
        letter-spacing: .2px;
        font-size: clamp(16px, 2vw, 20px);
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .ub-title .ub-chip {
        font-weight: 600;
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid var(--ub-border);
        background: var(--ub-bg-soft);
        color: var(--ub-text-soft);
      }
      .ub-meta {
        font-size: 12px;
        color: var(--ub-text-soft);
      }

      /* Summary cards */
      .ub-summaries {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 10px 0 14px;
      }
      .ub-card {
        background: var(--ub-card);
        border: 1px solid var(--ub-border);
        border-radius: var(--ub-radius-md);
        box-shadow: var(--ub-shadow-sm);
        padding: 12px;
      }
      .ub-card:hover { box-shadow: var(--ub-shadow-lg); transition: box-shadow .25s ease; }
      .ub-kpi-name {
        font-size: 12px;
        color: var(--ub-text-soft);
        display: flex; align-items: center; gap: 6px;
      }
      .ub-kpi-value {
        margin-top: 6px;
        font-weight: 800;
        font-size: clamp(16px, 2.4vw, 22px);
        letter-spacing: .3px;
      }
      .ub-kpi--bank .ub-kpi-value { color: var(--ub-text); }
      .ub-kpi--cobrar .ub-kpi-value { color: var(--ub-ok); }
      .ub-kpi--pagar .ub-kpi-value { color: var(--ub-bad); }

      /* Paneles de tablas */
      .ub-panels {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 4px;
      }
      @media (max-width: 900px) { .ub-panels { grid-template-columns: 1fr; } }

      .ub-panel { position: relative; }
      .ub-panel-header {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 8px;
      }
      .ub-panel-title {
        font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
      }
      .ub-panel-actions {
        display: flex; align-items: center; gap: 8px;
      }
      .ub-btn {
        appearance: none; border: 1px solid var(--ub-border);
        background: var(--ub-bg-soft); color: var(--ub-text);
        padding: 6px 10px; border-radius: 10px; font-size: 12px; font-weight: 600;
        cursor: pointer;
      }
      .ub-btn:hover { filter: brightness(1.05); }
      .ub-btn--primary {
        background: var(--ub-accent);
        color: #fff; border-color: transparent;
      }

      /* Tabla */
      .ub-table-wrap {
        background: var(--ub-card);
        border: 1px solid var(--ub-border);
        border-radius: var(--ub-radius-md);
        overflow: hidden;
      }
      table.ub-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .ub-table thead th {
        position: sticky; top: 0;
        background: var(--ub-bg-soft);
        color: var(--ub-text);
        text-align: left;
        font-weight: 700;
        letter-spacing: .3px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--ub-border);
        z-index: 1;
      }
      .ub-table tbody td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--ub-border);
        vertical-align: middle;
      }
      .ub-row { cursor: pointer; }
      .ub-row:focus-visible { outline: 2px solid var(--ub-accent); outline-offset: -2px; }
      .ub-row:hover { background: color-mix(in oklab, var(--ub-accent) 6%, transparent); }

      .ub-badge {
        display: inline-block; min-width: 22px; text-align: center;
        padding: 2px 6px; border-radius: 999px; font-weight: 700; font-size: 12px;
        color: #fff; background: var(--ub-accent);
      }
      .ub-amount { font-weight: 800; text-align: right; }

      /* Estados: loading / empty / error */
      .ub-empty, .ub-error { padding: 14px; font-size: 13px; color: var(--ub-text-soft); }
      .ub-error strong { color: var(--ub-bad); }
      .ub-skeleton-row td { padding: 10px 12px; }
      .ub-skeleton {
        height: 12px; border-radius: 6px; display: inline-block; width: 100%;
        background: linear-gradient(90deg, var(--ub-bg-soft) 25%, var(--ub-border) 37%, var(--ub-bg-soft) 63%);
        background-size: 400% 100%;
        animation: ub-shimmer 1.1s ease-in-out infinite;
      }
      @keyframes ub-shimmer {
        0% { background-position: 100% 0; }
        100% { background-position: 0 0; }
      }

      /* Botones del menú superior heredados */
      li[data-name="exit"] { top: 10px; left: 0; position: absolute; }
      li[data-name="export"] { top: 10px; left: 70px; position: absolute; }

      /* Pie */
      .ub-note {
        margin-top: 10px;
        font-size: 12px;
        color: var(--ub-text-soft);
      }

      /* Seguridad extra para que nada fuerce fondo oscuro */
      html, body, #container-reportes { background: #ffffff; }
    </style>

    <script>
      (function () {
        // === Utilidades seguras y modernas ===
        const nf = (value) => {
          // Respeta tu objeto global currency si existe
          try {
            if (window.currency && typeof value === 'number') {
              return window.currency.symbol + ' ' + $.number(
                value,
                window.currency.decimals,
                window.currency.decimals_sep,
                window.currency.thousands_sep
              );
            }
          } catch (e) {}
          // Fallback con Intl si currency no existe
          try {
            const fmt = new Intl.NumberFormat(undefined, {
              style: 'currency',
              currency: (window.currency && window.currency.code) || 'USD',
              maximumFractionDigits: (window.currency && window.currency.decimals) || 2
            });
            return fmt.format(value || 0);
          } catch (e) {
            return (window.currency?.symbol || '$') + ' ' + (value || 0).toLocaleString();
          }
        };

        let currentXhr = null; // para abortar llamadas previas

        const $container = $('#container-reportes');
        const $tbodyCobros = $container.find('table.ub-table--cobros > tbody');
        const $tbodyPagos  = $container.find('table.ub-table--pagos > tbody');

        function setUpdatedAt() {
          const now = new Date();
          const pad = (n) => String(n).padStart(2, '0');
          $('.ub-meta .ub-updated-at').text(
            `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`
          );
        }

        function skeletonRows($tbody, rows = 5) {
          $tbody.empty();
          for (let i = 0; i < rows; i++) {
            $tbody.append(`
              <tr class="ub-skeleton-row">
                <td><span class="ub-skeleton" style="max-width: 70%"></span></td>
                <td style="width:120px"><span class="ub-skeleton" style="max-width: 60px"></span></td>
                <td style="width:140px"><span class="ub-skeleton" style="max-width: 90px"></span></td>
              </tr>
            `);
          }
        }

        function emptyRow($tbody, text) {
          $tbody.html(`<tr><td colspan="3"><div class="ub-empty">${text}</div></td></tr>`);
        }

        function errorRow($tbody, text) {
          $tbody.html(`<tr><td colspan="3"><div class="ub-error"><strong>Error:</strong> ${text}</div></td></tr>`);
        }

        function rowTemplate(item, type) {
          // type: 'cobrar' | 'pagar'
          const nombre = type === 'cobrar' ? (item.cliente || '-') : (item.proveedor || '-');
          const cantidad = Number(item.cantidad || 0);
          const monto = Number(item.monto || 0);
          const id = item.id ?? 0;
			debugger
          return $(`
            <tr class="ub-row" tabindex="0" role="button" aria-label="${nombre}">
              <td>
                <div class="ub-name" title="${nombre}">${nombre}</div>
              </td>
              <td style="width:120px">
                <span class="ub-badge" aria-label="Documentos pendientes">${cantidad}</span>
              </td>
              <td class="ub-amount" style="width:140px">${nf(monto)}</td>
            </tr>
          `).on('click keydown', function (ev) {
            if (ev.type === 'click' || (ev.type === 'keydown' && (ev.key === 'Enter' || ev.key === ' '))) {
				document.getElementById('textBusqueda').value = nombre
				document.getElementById('textBusquedaProveedores').value = nombre
              const url = type === 'cobrar'
                ? `/v3/views/reportes/dialog/porcobrar.shtml?id=${id}&nombre=${nombre}`
                : `/v3/views/reportes/dialog/porpagar.shtml?id=${id}&nombre=${nombre}`;
              unaBase.loadInto.dialog(url, type === 'cobrar' ? 'FACTURAS POR COBRAR' : 'FACTURAS POR PAGAR', 'x-large');
            }
          });
        }

        function renderList(list, $tbody, type) {
          $tbody.empty();
          if (!Array.isArray(list) || list.length === 0) {
            emptyRow($tbody, 'Sin registros.');
            return;
          }
          let count = 0;
          for (const item of list) {
            if (count >= 20) break;
            $tbody.append(rowTemplate(item, type));
            count++;
          }
        }

        function updateKpis(data) {
          $('.ub-kpi--bank .ub-kpi-value').text(nf(Number(data.saldo_banco || 0)));
          $('.ub-kpi--cobrar .ub-kpi-value').text(nf(Number(data.total_por_cobrar || 0)));
          $('.ub-kpi--pagar .ub-kpi-value').text(nf(Number(data.total_por_pagar || 0)));
        }

        function getCategorias() {
          // unaBase.ui.block(); // si quieres el overlay global

          // Aborta request anterior si aún vive
          if (currentXhr && currentXhr.readyState !== 4) {
            try { currentXhr.abort(); } catch (e) {}
          }

          // Estados de carga
          skeletonRows($tbodyCobros, 20);
          skeletonRows($tbodyPagos, 20);
          $('#search').find('*').prop('disabled', true);

          let fields = '';
          try {
            const searchFields = $.param(unaBase.toolbox.search.advancedFilter || {});
            const serialFields = $('#search').serializeAnything ? $('#search').serializeAnything() : $('#search').serialize();
            fields = searchFields ? (searchFields + '&' + serialFields) : serialFields;
          } catch (e) {
            fields = $('#search').serialize();
          }

          currentXhr = $.ajax({
            url: '/4DACTION/_V3_getResumenFlujoCaja',
            data: fields,
            dataType: 'json',
            timeout: 25000,
            success: function (data) {
              try {
                updateKpis(data || {});
                renderList(data?.por_cobrar || [], $tbodyCobros, 'cobrar');
                renderList(data?.por_pagar || [], $tbodyPagos, 'pagar');
                setUpdatedAt();
              } catch (e) {
                errorRow($tbodyCobros, 'No se pudo interpretar los datos.');
                errorRow($tbodyPagos, 'No se pudo interpretar los datos.');
                console.error('[UB] Parse error:', e);
              }
            },
            error: function (xhr, text, error) {
              if (text === 'abort') return; // usuario buscó de nuevo
              errorRow($tbodyCobros, error || 'Fallo de conexión.');
              errorRow($tbodyPagos, error || 'Fallo de conexión.');
              console.error('[UB] AJAX error:', error);
            },
            complete: function () {
              $('#search').find('*').prop('disabled', false);
              // unaBase.ui.unblock();
            }
          });
        }

        // Exponer para re-uso si lo necesitas
        window.ubGetCtas = getCategorias;

        // Ready
        $(document).ready(function () {
          unaBase.toolbox.init();

          unaBase.toolbox.search.init({
            callback: function () {
              const disabled = $('#search').find('*').prop('disabled');
              if (!disabled) getCategorias();
              return false;
            },
            inflection: { singular: 'categoria', plural: 'categorias', none: 'ninguna' },
            filters: [],
            hideSearchBox: true
          });

          unaBase.toolbox.menu.init({
            entity: 'estado_resultados',
            buttons: ['exit'] // puedes agregar 'export' si aplica
          });

          // Botones “ver más”
          $container.on('click', '.ub-btn--more-cobros', function (row) {
            document.getElementById('textBusqueda').value = '';
            unaBase.loadInto.dialog('/v3/views/reportes/dialog/porcobrar.shtml?id=0', 'FACTURAS POR COBRAR', 'x-large');
          });
          $container.on('click', '.ub-btn--more-pagos', function () {
            document.getElementById('textBusquedaProveedores').value = '';
            unaBase.loadInto.dialog('/v3/views/reportes/dialog/porpagar.shtml?id=0', 'FACTURAS POR PAGAR', 'x-large');
          });

          // Carga inicial
          getCategorias();
        });
      })();
    </script>
  </head>

  <body>
    <section id="container-reportes">
		<input type="hidden" id="textBusqueda">
		<input type="hidden" id="textBusquedaProveedores">
      <!-- Header -->
      <div class="ub-header">
        <div class="ub-title">
          CUENTAS POR COBRAR Y PAGAR
          <span class="ub-chip">Ordenado por vencimiento y monto</span>
        </div>
        <div class="ub-meta">Actualizado: <span class="ub-updated-at">--:--:--</span></div>
      </div>

      <!-- KPIs -->
      <div class="ub-summaries">
        <div class="ub-card ub-kpi ub-kpi--bank">
          <div class="ub-kpi-name">Saldo en banco</div>
          <div class="ub-kpi-value">—</div>
        </div>
        <div class="ub-card ub-kpi ub-kpi--cobrar">
          <div class="ub-kpi-name">Por cobrar</div>
          <div class="ub-kpi-value">—</div>
        </div>
        <div class="ub-card ub-kpi ub-kpi--pagar">
          <div class="ub-kpi-name">Por pagar</div>
          <div class="ub-kpi-value">—</div>
        </div>
      </div>

      <!-- Paneles -->
      <div class="ub-panels">
        <!-- POR COBRAR -->
        <div class="ub-panel">
          <div class="ub-panel-header">
            <div class="ub-panel-title">Top #20 clientes por cobrar</div>
            <div class="ub-panel-actions">
              <button class="ub-btn ub-btn--primary ub-btn--more-cobros" type="button">Ver más</button>
            </div>
          </div>
          <div class="ub-table-wrap ub-card">
            <table class="ub-table ub-table--cobros sortable">
              <thead>
                <tr>
                  <th>Cliente</th>
                  <th style="width:120px">Pendientes</th>
                  <th style="width:140px">Por cobrar</th>
                </tr>
              </thead>
              <tbody>
                <!-- skeleton/rows se inyectan por JS -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- POR PAGAR -->
        <div class="ub-panel">
          <div class="ub-panel-header">
            <div class="ub-panel-title">Top #20 proveedores por pagar</div>
            <div class="ub-panel-actions">
              <button class="ub-btn ub-btn--primary ub-btn--more-pagos" type="button">Ver más</button>
            </div>
          </div>
          <div class="ub-table-wrap ub-card">
            <table class="ub-table ub-table--pagos sortable">
              <thead>
                <tr>
                  <th>Proveedor</th>
                  <th style="width:120px">Pendientes</th>
                  <th style="width:140px">Por pagar</th>
                </tr>
              </thead>
              <tbody>
                <!-- skeleton/rows se inyectan por JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </section>
  </body>
</html>
