    <div style="text-align:left;margin:6px 10px 0px 40px;">
    <button id="btn-export-excel"
        onclick="exportarInfFacExcel()"
        style="background-color:#08A86C;color:white;border:none;padding:7px 16px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:bold;">
        &#x21E9;&nbsp;Descargar Excel
    </button>
    </div>
    <div class="totalreg" style="margin-top:4px;font-weight:bold;">
        Total Facturas: <!--#4DVAR v_TotReg-->
    </div>
    <script>
        var _nodeUrl = (function() {
            var nu = "<!--#4DHTML nodeUrl-->";
            if (nu && nu.indexOf('<!--') === -1 && nu.length > 3) return nu;
            var ip   = "<!--#4DHTML _V3_nodejs_public_ipaddr-->";
            var port = "<!--#4DHTML _V3_nodejs_port-->";
            //if (ip && ip.indexOf('<!--') === -1) return 'http://' + ip + ':' + port;
            return '';
        })();
        function exportarInfFacExcel() {
            if (!_nodeUrl) {
                alert('Error: No se pudo determinar la URL del servidor Node.js.\nVerifica que nodeUrl o _V3_nodejs_public_ipaddr estén definidos en 4D.');
                return;
            }
            var btn = document.getElementById('btn-export-excel');
            btn.disabled = true;
            btn.innerHTML = 'Generando...';
            fetch(window.location.origin + '/4DACTION/INFO_FAC_X_COBRAR?download=true')
                .then(function(r) {
                    if (!r.ok) throw new Error('Error 4D: ' + r.status);
                    return r.json();
                })
                .then(function(jsonData) {
                    return fetch(_nodeUrl + '/export-inf-fac-x-cobrar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(jsonData)
                    });
                })
                .then(function(r) {
                    if (!r.ok) throw new Error('Error Excel: ' + r.status);
                    return r.blob();
                })
                .then(function(blob) {
                    var a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'Facturas_por_cobrar.xlsx';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(a.href);
                })
                .catch(function(e) { alert('Error al descargar: ' + e.message); })
                .finally(function() {
                    btn.disabled = false;
                    btn.innerHTML = '&#x21E9;&nbsp;Descargar Excel';
                });
        }
        (function() {
            var tot = document.getElementById('btn-export-excel').getAttribute('data-totreg') || '';
            var el  = document.getElementById('totalreg-display');
            if (el) el.textContent = 'Total Facturas: ' + tot;
        })();
    </script>
