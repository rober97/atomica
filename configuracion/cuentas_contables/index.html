<style>
    html {
        overflow: hidden;
    }

    html, body {
      height: 100%;
      margin: 0;

    iframe {
      position: absolute; /* Posicionamiento absoluto dentro del contenedor */
      top: 0;
      left: 0;
      width: 100%; /* Ancho total del contenedor */
      height: 100%; /* Altura total del contenedor */
      border: none;
    }

    .contenedor {
      height: calc(100% - 50px); /* Altura dinámica (en este caso, la altura total de la ventana) */
      position: relative; /* Necesario para el posicionamiento absoluto del iframe */
    }
</style>
