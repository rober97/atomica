<!DOCTYPE html>
<!--#4DSCRIPT/_V3_proxy_getPerfilContacto2-->
<html>
  <head>
    <title>Perfil</title>
    <meta charset="utf-8">
    <script type="text/javascript" src="/v3/views/contactos/content.js?asdf"></script>
    <link rel="stylesheet" href="/v3/design/temporal.css?<!--#4DTEXT random-->">

    <script>
      $(document).ready(function() {
        var id = $('.form-contact').find('input[name="id"]').val();
        var alias = window.contactoInfoAlias || window.nombreEmpresaTmp || '';
        var razonSocialTmp = window.contactoInfoRazonSocial || '';
        // inyectar alias para que general.shtml lo pueda usar
        if (alias && !$('.form-contact input[name="contacto[info][alias]"]').length) {
          $('<input>', {
            type: 'hidden',
            name: 'contacto[info][alias]',
            value: alias
          }).appendTo('.form-contact');
        }

        // inyectar razón social temporal para que general.shtml la pueda usar
        if (razonSocialTmp && !$('.form-contact input[name="contacto[info][razon_social_tmp]"]').length) {
          $('<input>', {
            type: 'hidden',
            name: 'contacto[info][razon_social_tmp]',
            value: razonSocialTmp
          }).appendTo('.form-contact');
        }

          // Se limpian las variables
        window.contactoInfoAlias = '';
        window.nombreEmpresaTmp = '';
        window.contactoInfoRazonSocial = '';

        // Refresca contacto cuando se cierra el dialog
        const $dlgContent = $('#main-container.form-contact').closest('.ui-dialog-content');
        if ($dlgContent.length) {
          $dlgContent.on('dialogbeforeclose', function () {
            const idEmpresa = $('.form-contact').find('input[name="id"]').val();

            if (window.refreshEmpresaExterna) {
              window.refreshEmpresaExterna(idEmpresa);
            }
          });
        }

        // Función para manejar errores en las cargas
        var handleLoadError = function(response, status, xhr) {
          if (status === "error") {
            console.error('Error al cargar contenido:', {
              url: xhr.responseURL || 'desconocido',
              status: xhr.status,
              statusText: xhr.statusText,
              response: xhr.responseText
            });
            
            var errorMessage = 'La operación no se pudo completar. ';
            if (xhr.status === 500) {
              errorMessage += 'Error interno del servidor. Póngase en contacto con soporte para mayor asistencia.';
            } else if (xhr.status === 404) {
              errorMessage += 'Recurso no encontrado.';
            } else if (xhr.status === 0) {
              errorMessage += 'No se pudo conectar con el servidor.';
            } else {
              errorMessage += 'Error: ' + (xhr.statusText || 'Desconocido') + '. Póngase en contacto con soporte para mayor asistencia.';
            }
            
            if (typeof toastr !== 'undefined') {
              toastr.error(errorMessage);
            } else {
              alert(errorMessage);
            }
          }
        };
         
        $("#tabs-1-contacto").load('/v3/views/contactos/general.shtml', 'id='+ id, function(response, status, xhr) {
          if (status === "error") {
            handleLoadError(response, status, xhr);
          } else {
            // Código que se ejecuta después de cargar la pestaña General
            // Nota: El código 4D se procesa en el servidor antes de enviar la respuesta
          }
        });
        
        $("#tabs-2-contacto").load('/v3/views/contactos/banco.shtml', 'id='+ id, handleLoadError);
        $("#tabs-3-contacto").load('/v3/views/contactos/adicional.shtml', 'id='+ id, handleLoadError);
        $("#tabs-4-contacto").load('/v3/views/contactos/relacionados.shtml', 'id='+ id, handleLoadError);
        $("#tabs-5-contacto").load('/v3/views/contactos/catalogo.shtml', 'id='+ id, handleLoadError);
        $("#tabs-6-contacto").load('/v3/views/contactos/servicios_asignados.shtml', 'id='+ id, handleLoadError);
        $("#tabs-7-contacto").load('/v3/views/contactos/archivos.shtml', 'id='+ id, handleLoadError);

        $('a[href="#tabs-8-contacto"]').click(function() {
          // unaBase.interval.clearAll();
          $("#tabs-8-contacto").load('/v3/views/contactos/descuentos.shtml', 'id='+ id, handleLoadError);
        });
        $('a[href="#tabs-9-contacto"]').click(function() {
          // unaBase.interval.clearAll();
          $("#tabs-9-contacto").load('/v3/views/historial/index.shtml', 'mod=contacto&id='+id, handleLoadError);
        });
        

      });
    </script>
    <style type="text/css">
      .ui-tabs .ui-tabs-panel {
        padding: 0 !important;
        overflow: hidden;
      }
      .obligatorio{
        color:red!important;
        font-weight:bold;
        margin:2px;
      }

      .box-nombre-contacto{
        font-weight: bold;
        position: absolute;
        top: 20px;
        right: 20px;
        font-size:12px;
      }

    </style>
  </head>
  <body>
    <div id="main-container" class="form-contact">
      <div class="box-nombre-contacto"><!--#4DTEXT Uppercase([Contacto]nombre_completo;*)--></div>
      <input type="hidden" name="id" value="<!--#4DTEXT [Contacto]Id_Cont-->">
      <section class="tabs">
        <ul class="infinite-tabs">
          <li><a href="#tabs-1-contacto">General</a></li>
          <li class="load-banco" data-id="<!--#4DTEXT [Contacto]Id_Cont-->"><a href="#tabs-2-contacto">Comercial</a></li>

          <li class="load-adicional" data-id="<!--#4DTEXT [Contacto]Id_Cont-->"><a href="#tabs-3-contacto">Datos adicionales</a></li>
          <li class="load-relacionados" data-id="<!--#4DTEXT [Contacto]Id_Cont-->"><a href="#tabs-4-contacto">Contactos relacionados</a></li>

          <li class="load-catalogo" data-id="<!--#4DTEXT [Contacto]Id_Cont-->"><a href="#tabs-5-contacto">Historial compra y venta</a></li>
          <li class="load-ser-asignados" data-id="<!--#4DTEXT [Contacto]Id_Cont-->"><a href="#tabs-6-contacto">Servicios asignados</a></li>
          <li class="load-archivos" data-id="<!--#4DTEXT [Contacto]Id_Cont-->"><a href="#tabs-7-contacto">Archivos adjuntos</a></li>
          <li class="load-descuentos" data-id="<!--#4DTEXT [Contacto]Id_Cont-->"><a href="#tabs-8-contacto">Descuentos legales</a></li>
          <li class="load-historial" data-id="<!--#4DTEXT [Contacto]Id_Cont-->"><a href="#tabs-9-contacto">Historial</a></li>
        </ul>
        <article id="tabs-1-contacto"></article>
        <article id="tabs-2-contacto"></article>
        <article id="tabs-3-contacto"></article>
        <article id="tabs-4-contacto"></article>
        <article id="tabs-5-contacto"></article>
        <article id="tabs-6-contacto"></article>
        <article id="tabs-7-contacto"></article>
        <article id="tabs-8-contacto"></article>
        <article id="tabs-9-contacto"></article>
      </section>
    </div>
    <div style="margin:5px">(<strong class="obligatorio">*</strong>)<label> Información necesaria.</label></div>
  </body>
</html>
