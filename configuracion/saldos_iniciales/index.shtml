<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>Saldos iniciales</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap">
    <link rel="stylesheet" type="text/css"
        href="https://cdn.datatables.net/v/bs4/dt-1.11.3/fc-4.0.1/fh-3.2.0/r-2.2.9/datatables.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/1.6.5/css/buttons.dataTables.min.css">
    <link rel="stylesheet" href="/configuracion/css/saldos_iniciales/index.css">
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
</head>

<body>
    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h5 class="m-0 text-dark"></h5>
                    </div>
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                            <li class="breadcrumb-item"><a href="#">Inicio</a></li>
                            <li class="breadcrumb-item active">Configuración</li>
                            <li class="breadcrumb-item active">Saldos iniciales</li>
                        </ol>
                    </div>
                </div>
            </div>
            <div class="shadow p-3 mb-5 bg-white rounded">
                <div class="card-header">
                    <section class="content">
                        <div class="box box-info ">
                            <a class="btn btn-success btn-labeled" href="/configuracion/index.shtml" role="button"
                                style="background: #34CC02;">
                                <span class="btn-label"><i class="fas fa-arrow-circle-left"></i></span>
                                <strong>Volver</strong></a>

                            <button type="button" class="btn btn-success" id="btn-nuevo"
                                style="background: #03D6F9;" title="Nuevo saldo inicial">
                                <i class="fas fa-plus-circle"></i>
                            </button>

                            <hr class="mt-2 mb-3" />

                            <!-- Filtros de listado -->
                            <div class="row align-items-end mb-2">
                                <div class="col-md-3">
                                    <label for="filtro_cuenta" class="col-form-label">Cuenta corriente</label>
                                    <input type="text" class="form-control" id="filtro_cuenta"
                                        placeholder="Ej: 00012345678">
                                </div>
                                <div class="col-md-2">
                                    <label for="filtro_anio" class="col-form-label">Año</label>
                                    <input type="number" class="form-control" id="filtro_anio" placeholder="Ej: 2026">
                                </div>
                                <div class="col-md-4">
                                    <button type="button" class="btn btn-primary" id="btn-buscar">
                                        <i class="fas fa-search"></i> Buscar
                                    </button>
                                    <button type="button" class="btn btn-secondary" id="btn-limpiar">
                                        <i class="fas fa-eraser"></i> Limpiar
                                    </button>
                                </div>
                            </div>

                            <div class="box-body">
                                <div class="table-responsive">
                                    <div id="loading-modal"></div>
                                    <table id="saldos_iniciales"
                                        class="table table-striped table-bordered table-sm tablesaldos" cellspacing="0"
                                        style="width:100%">
                                        <thead>
                                            <tr>
                                                <th style="background-color: #34CC02; color: white; width: auto;">#</th>
                                                <th style="background-color: #34CC02; color: white; width: auto;">
                                                    Cuenta corriente</th>
                                                <th style="background-color: #34CC02; color: white; width: auto;">
                                                    Año</th>
                                                <th style="background-color: #34CC02; color: white; width: auto;">
                                                    Monto</th>
                                                <th style="background-color: #34CC02; color: white; width: auto;">
                                                    Acción</th>
                                            </tr>
                                        </thead>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>

        <!-- Modal crear / editar -->
        <div id="modalSaldo" class="modal fade bd-example-modal-lg" role="dialog">
            <div class="modal-dialog modal-lg">
                <div class="table-responsive">
                    <div class="modal-content">
                        <div class="modal-header bg-blue">
                            <h5 class="text-white" id="modalSaldoTitle">Nuevo saldo inicial</h5>
                            <button type="button" class="close-white" data-dismiss="modal">&times;</button>
                        </div>
                        <br>
                        <div class="modal-body">
                            <input type="hidden" id="saldo_id" value="0">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="cuenta" class="col-form-label">Cuenta corriente</label>
                                        <input type="text" class="form-control" id="cuenta"
                                            placeholder="Ej: 00012345678">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="anio" class="col-form-label">Año</label>
                                        <input type="number" class="form-control" id="anio" placeholder="Ej: 2026">
                                        <small class="form-text text-muted">2026 = saldo al 31-12-2025.</small>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="monto" class="col-form-label">Monto</label>
                                        <input type="number" class="form-control" id="monto" placeholder="Ej: 11000">
                                        <small class="form-text text-muted">Saldo al 01-01 de ese año.</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer bg-white">
                            <button type="button" class="btn btn-primary" id="btn-guardar">Guardar</button>
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal confirmar borrado -->
        <div id="ModalConfirm" class="modal fade bd-example-modal-lg" role="dialog">
            <div class="modal-dialog modal-sm">
                <div class="table-responsive">
                    <div class="modal-content">
                        <div class="modal-header bg-blue">
                            <H5 class="text-white">Confirmar</H5>
                            <button type="button" class="close-white" data-dismiss="modal">&times;</button>
                        </div>
                        <br>
                        <div class="modal-body">
                            <div class="alert alert-danger" role="alert">
                                ¿Estás seguro que deseas eliminar este saldo inicial?
                            </div>
                        </div>
                        <div class="modal-footer bg-white">
                            <input type="button" class="btn btn-primary" value="Si" id="btn-confirm-delete">
                            <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/base_object/general_template.js"></script>
    <script src="/v3/script/jquery/jquery.js"></script>
    <script src="/v3/script/jquery-ui-1.12.1/jquery-ui.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.18.0/axios.min.js"></script>
    <script type="text/javascript" src="/configuracion/script/index.js"></script>
    <!-- Script modal-->
    <script type="text/javascript"
        src="https://cdn.datatables.net/v/bs4/dt-1.11.3/fc-4.0.1/fh-3.2.0/r-2.2.9/datatables.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
    <!-- COLUMN --->
    <script src="https://cdn.datatables.net/buttons/1.6.5/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/1.6.5/js/buttons.colVis.min.js" defer></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script type="text/javascript" src="/configuracion/script/saldos_iniciales.js"></script>
</body>

</html>
