	<script>

		$(document).ready(function () {
			document.title = nombreEmpresa + ' / Contactos';
			$('.credencial tbody').on("click", "tr > td > div.chk > input", function (event) {
				var cantChecked = $('.credencial > tbody > tr > td > div.chk > input:checked').length;
				var buttonDisable = $('#menu ul li[data-name="disable_from_list"]');
				var buttonMerge = $('#menu ul li[data-name="merge_contact"]');
				var buttonTag = $('#menu ul li[data-name="tag_contact"]');

				if (cantChecked == 0) {
					buttonDisable.hide();
					buttonTag.hide();
					buttonMerge.hide();
				} else {
					if (cantChecked == 1) {
						buttonDisable.show();
						buttonTag.show();
						buttonMerge.hide();
					} else {
						if (cantChecked > 1) {
							buttonDisable.show();
							buttonTag.show();
							buttonMerge.show();
						}
					}
				}
			});



			unaBase.toolbox.init();

			// Inicializamos un buscador
			var params = {
				searchOff: true,
				// Función que genera una URL de listado JSON
				url: function () { return '/4DACTION/_V3_getContactos_' },
				entity: 'Contacto',
				// Función que genera cada fila de la tabla, dado el valor de i (índice de posición)
				// y el valor de rows (array con todos los resultados)
				// El contenido de rows corresponde al objeto de mismo nombre generado mediante la llamada
				// a la api JSON. Ver /v3/json/get_cotizacion.shtml para conocer el formato.
				row: {
					html: function (i, rows) {
						// Validar que el elemento existe
						if (!rows[i]) {
							return '';
						}
						
						var contacto = "";
						var completo = (rows[i].nombre_completo) ? $.trim(String(rows[i].nombre_completo)) : "";
						var alias = (rows[i].alias) ? $.trim(String(rows[i].alias)) : "";
						var razon = (rows[i].razon) ? $.trim(String(rows[i].razon)) : "";
						var nombres = (rows[i].nombres) ? $.trim(String(rows[i].nombres)) : "";
						var paterno = (rows[i].paterno) ? $.trim(String(rows[i].paterno)) : "";

						contacto = completo;
						if (contacto == "") {
							if (razon != "") {
								contacto = razon;
							} else {
								if (nombres != "") {
									contacto = nombres + ' ' + paterno;
								} else {
									contacto = alias;
								}
							}
						}

						if (contacto.length > 22) {
							contacto = contacto.substring(0, 22) + "...";
						}

						var fono = (rows[i].telefono1) ? String(rows[i].telefono1) : "";
						if (fono == "") {
							fono = "Ninguno";
						}

						var rut = (rows[i].rut) ? String(rows[i].rut) : "";
						if (rut == ""){
							rut = "Ninguno";
						}

						var email = (rows[i].email) ? String(rows[i].email) : "";
						if (email == "") {
							email = "Ninguno";
						}

						var tipo = (rows[i].tipo) ? String(rows[i].tipo) : "";
						
						var cadenaDir = "";
						if (rows[i].dir_calle && String(rows[i].dir_calle).trim() != "") {
							cadenaDir = String(rows[i].dir_calle).trim() + ", "
						}

						if (rows[i].dir_ciudad && String(rows[i].dir_ciudad).trim() != "") {
							var comuna = (rows[i].dir_comuna) ? String(rows[i].dir_comuna).trim() : "";
							if (comuna != "") {
								cadenaDir = cadenaDir + comuna + ", "
							}
						}

						if (rows[i].dir_comuna && String(rows[i].dir_comuna).trim() != "") {
							var ciudad = (rows[i].dir_ciudad) ? String(rows[i].dir_ciudad).trim() : "";
							var comuna = String(rows[i].dir_comuna).trim();
							if (ciudad != "" && ciudad != comuna) {
								cadenaDir = cadenaDir + ciudad + ", "
							}
						}

						if (cadenaDir.length > 2) {
							cadenaDir = cadenaDir.substring(0, cadenaDir.length - 2);
						} else if (cadenaDir.length > 0) {
							cadenaDir = cadenaDir.substring(0, cadenaDir.length - 2);
						}

						var tags = "";
						if (rows[i].tags && Array.isArray(rows[i].tags) && rows[i].tags.length > 0) {
							$.each(rows[i].tags, function (key, item) {
								if (item && item.tag_name) {
									tags = tags + "<span>#" + item.tag_name + "</span>";
								}
							});
						}

						var id = (rows[i].id) ? rows[i].id : "";
						var contactoIniciales = (contacto.match(/\b(\w)/g) != null) ? contacto.match(/\b(\w)/g).join('').substring(0, 2) : '';
						
						return '<tr data-id="' + id + '">' +
							'<td><div class="chk"><input type="checkbox" value="' + id + '" name="contacto[id]" /></div></td>' +
							//'<td><div>sin foto</div></td>' +
							'<td>' + (contacto ? contacto.toLowerCase() : "") + '</td>' +
							'<td>' + (tipo ? tipo.toLowerCase() : "") + '</td>' +
							'<td>' + (cadenaDir || "") + '</td>' +
							'<td><span>Rut:</span><a target="_blank" href="rut:' + rut + '">' + rut + '</a></td>' +
							'<td><span>Email:</span><a target="_blank" href="mailto:' + email + '">' + email + '</a></td>' +
							
							'<td><div class="container-tags">' + tags + '</div></td>' +
							'</tr>'

					}
				},
				detail: {
					// Función que genera una URL de detalle, dado el id (identificador de item)
					//url: function(id) { return '/v3/views/contactos/pop_perfil.shtml?id=' + id },
					url: function (id) { return '/v3/views/contactos/content.shtml?id=' + id },
					iframe: false,
					dialog: true,
					size: 'x-large'

				},
				// Inflexiones
				inflection: {
					singular: 'contacto',
					plural: 'contactos',
					none: 'ningún'
				},
				// Filtros
				filters: [
					{ name: 'tags', type: 'autocomplete', caption: 'Etiquetas', dataSource: 'getTags' },
					{
						name: 'tipos', type: 'autocomplete', caption: 'Tipo', dataObject: [
							{ id: 'CLIENTE', text: 'CLIENTE' },
							{ id: 'PROVEEDOR', text: 'PROVEEDOR' }
						]
					},
					{
						name: 'estado', type: 'checkbox', caption: 'Estado', options: [
							{ caption: 'Activo', name: 'estado_activo', value: true },
							{ caption: 'Inactivo', name: 'estado_inactivo', value: false }
						]
					},
					{ name: 'pais', type: 'autocomplete', caption: 'Pais', dataSource: 'get_pais' }
				]
			};

			unaBase.toolbox.search.init(params);
			unaBase.toolbox.menu.init({
				entity: 'Contacto',
				buttons: ['searchOff', "new_contact", "disable_from_list", "merge_contact", "tag_contact", "export_list"]
			});

			// disabled buttons
			$('#menu ul li[data-name="merge_contact"]').hide();
			$('#menu ul li[data-name="tag_contact"]').hide();
			$('#menu ul li[data-name="disable_from_list"]').hide();



			let contenedor = document.querySelector('#contenedor')
			function onError(){
				return `<div class="container"><h2>PICO</h2></div>`;
			}

			const setContactos = () => {
				let card = ''
				$.ajax({
					url: "/4DACTION/_V3_getContactos_",
					data: {
						estado_activo: true,
					},
					dataType: "json",
					success: function (data) {


						data.rows.forEach(element => {
							var contacto = "";
							var completo = element.nombre_completo.trim();
							var alias = element.alias.trim();
							var razon = element.razon.trim();
							var nombres = element.nombres.trim();
							var paterno = element.paterno.trim();

							contacto = completo;
							if (contacto == "") {
								if (razon != "") {
									contacto = razon;
								} else {
									if (nombres != "") {
										contacto = nombres + ' ' + paterno;
									} else {
										contacto = alias;
									}
								}
							}

							if (contacto.length > 42) {
								contacto = contacto.substring(0, 42) + "...";
							}

							var fono = element.telefono1;
							if (fono == "") {
								fono = "Ninguno";
							}

							var email = element.email;
							if (email == "") {
								email = "Ninguno";
							}

							var cadenaDir = "";
							if (element.dir_calle.trim() != "") {
								cadenaDir = element.dir_calle + ", "
							}

							if (element.dir_ciudad.trim() != "") {
								cadenaDir = cadenaDir + element.dir_comuna + ", "
							}

							if (element.dir_comuna.trim() != "") {
								if (element.dir_ciudad != element.dir_comuna) {
									cadenaDir = cadenaDir + element.dir_ciudad + ", "
								}
							}

							cadenaDir = cadenaDir.substring(0, cadenaDir.length - 2);

							// contenedor.innerHTML += `<div class="col-sm-2">
							// 				<div class="card mb-4">
							// 					<div class="row text-center">
							// 						<div class="col-md-12 mt-2 ml-2">
							// 							<img src="/4DACTION/_V3_getUpload?index=Contacto|' ${element.id} '" alt="${contacto}" onerror="$(this).after('<div>${(contacto.match(/\b(\w)/g) != null) ? contacto.match(/\b(\w)/g).join('').substring(0, 2) : ''}</div>'); $(this).remove();" class="rounded-circle" width="100" height="100">
							// 							<input id="chkDefault" type="checkbox"/>
							// 						</div>

	
							// 					</div>	
							// 					<div class="row">
							// 						<div class="col-md-12">
							// 							<div class="card-body" style="font-size: 12px;">
							// 								<h5 class="card-title font-weight-bold">${contacto.toLowerCase()}</h5>
							// 								<span class="badge badge-secondary mb-2">${element.tipo.toLowerCase()}</span>
							// 								<h5 class="card-title font-weight-bold">${cadenaDir}</h5>
							// 								<p class="card-text">TEL: ${fono}</p>
							// 								<p class="card-text">EMAIL: ${email}</p>
							// 							</div>
							// 						</div>
							// 					</div>
							// 				</div>
							// 			</div>`;

						});







					}
				});

			}

			//setContactos();

		});
	</script>

</head>

<body>
	<div id="dialog-form" title="Perfil contacto"></div>




	<div class="row col-auto" id="contenedor">


	</div>




	<div class="table-responsive ml-2 mt-2">

				<thead>
					<tr>
						<th style="width: 40px;"><input type="checkbox" id="selectAll" />

				</thead>
				<tbody></tbody>
