<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
	<meta http-equiv="content-type" content="text/html; charset=ISO-8859-1">
	<title>Lista de jerárquica desde 4D</title>

	<script src="/ajax/jquery/jquery.js" type="text/javascript"></script>
	
	
	<script type="text/javascript">


	function trae3(){
		$.get("/nombresusuarios", function(data){
			var array = data.split(',');

			$.each(array, function(k,v){
				//console.log(k+” -> ” +v.id + “, “+v.nombre);
				alert(this);
			});

			/*if(jQuery.isArray(array)){
				alert("es arreglo : "+ array );
			}else{
				alert("No es arreglo : " + array );				
			}*/			
		});	
	}	

	function trae4(){
		$.get('/tiposdetareas', function(data) {
		  $('.result').html(data);		 
		});		
	}	

	function borrar(){
		$(".result").html("");
	}	

	</script>
	
</head>
<body class="example">
	<h1>Testing AJAX with 4D y Jquery</h1>
	<button onclick="trae3()">trae 3</button>
	<button onclick="trae4()">trae 4</button>	
	<div class="result"></div>
	<button onclick="borrar()">borrar</button>
</body>
</html>
