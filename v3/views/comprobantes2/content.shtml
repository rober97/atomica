              comprobantes.addAutocomplete(item);

            const textareaElement = document.querySelector('textarea[name="description"]');
            const selectElement = document.querySelector('select[name="docType"]');
            const inputElement = document.getElementById('docDate');

            textareaElement.addEventListener('input', (event) => {
              if(event.target.value !== ''){
                event.target.style.border = ""
              }
            });


            selectElement.addEventListener('change', (event) => {
              if (event.target.value) {
                event.target.style.border = '';
              } 
            });

      /* Tabs container */
      .ub-tabs-container {

          flex-wrap: nowrap;

          background-color: white; 
          z-index: 1
      }

      /* Individual tab */
      .ub-tab {
          display: flex;
          align-items: center;
          justify-content: flex-start; 
          padding: 10px 20px;
          cursor: pointer;
          color: #888;
          border-bottom: 3px solid #e0e0e0; 
          transition: color 0.3s, border-bottom-color 0.3s;
          flex: 1; 
          white-space: nowrap; /* Evita que el texto se quiebre en múltiples líneas */
      }

      .ub-tab i {
          margin-right: 8px;
          color: #20A789; /* Color del icono */
      }

      .ub-tab span {
          flex-grow: 1; /* Permitir que el span ocupe el espacio restante */
          text-align: left; /* Asegurar que el texto se alinee a la izquierda dentro del span */
          font-weight: 500;
      }

      /* Active tab */
      .ub-active-tab {
          color: #20A789;
          border-bottom: 3px solid #20A789;
          border-radius: 2px;
      }

      /* Hover effect for inactive tabs */
      .ub-tab:not(.ub-active-tab):hover {
          color: #98EBD9; /* Cambiar color del texto al pasar el mouse */
          border-bottom: 3px solid #98EBD9; /* Cambiar color de la línea inferior al pasar el mouse */
      }

      /* Content container */
      .ub-content-container {
          padding: 20px;
          background-color: white;
          border-radius: 5px;
          margin-top: 20px;
      }

      /* Responsive design */
      @media (max-width: 768px) {
          .ub-tab {
              padding: 10px;
              font-size: 14px;
          }

          .ub-content-container {
              padding: 10px;
          }
      }
