  <!-- 🔒 GUARD: oculta todo y solo muestra si (1) iframe same-origin + (2) login OK -->
  <style>
    html.guard-hide body {
      display: none !important;
    }
  </style>
  <script>
    (function guard() {
      // Oculta todo por defecto (evita que se vea contenido antes del check)
      document.documentElement.classList.add("guard-hide");

      const deny = () => {
        // “No aparece nada”: dejamos el body vacío + oculto
        try { if (document.body) document.body.innerHTML = ""; } catch (_) { }
        // mantenemos guard-hide activo
      };

      const allow = () => {
        document.documentElement.classList.remove("guard-hide");
      };

      // 1) Debe estar embebido en iframe (si lo abres directo en pestaña => DENY)
      let isInIFrame = false;
      try {
        isInIFrame = (window.self !== window.top);
      } catch (e) {
        // Si falla acceder a top, asumimos cross-origin => DENY abajo
        isInIFrame = true;
      }
      if (!isInIFrame) return deny();

      // 2) El parent debe ser same-origin (si no => DENY)
      try {
        if (window.top.location.origin !== window.location.origin) return deny();
      } catch (e) {
        return deny();
      }

      // 3) Debe estar logeado (reusa tu misma lógica)
      const checkUrl =
        `${window.origin}/4DACTION/_v3_checkLogin?nodeUrl=${encodeURIComponent("https://frank.unabase.com/node")}`;

      fetch(checkUrl, { credentials: "include", cache: "no-store" })
        .then(r => r.ok ? r.json() : Promise.reject(r))
        .then(data => {
          if (!data || !data.isLogin || data.login == null) return deny();
          // OK: recién aquí mostramos
          allow();
        })
        .catch(() => deny());
    })();
  </script>
  <!-- 🔒 FIN GUARD -->

  <script>
    let __busyCount = 0;

    function safeBlock() {
      try { spinnerMain?.(true); } catch (_) { }
    }

    function safeUnblock() {
      try { spinnerMain?.(false); } catch (_) { }
    }

    (function () {
      function getBaseUrl() {
        const p = new URLSearchParams(location.search);
        const h = (p.get("hostname") || "").trim();
        if (!h) return window.location.origin;
        if (/^https?:\/\//i.test(h)) return h.replace(/\/+$/, "");
        return ("https://" + h).replace(/\/+$/, "");
      }

      const baseUrl = getBaseUrl();

      const el = {
        btnReload: document.getElementById("btnReload"),
        select1: document.getElementById("select1"),
        select2: document.getElementById("select2"),
        list1: document.getElementById("list1"),
        list2: document.getElementById("list2"),
        count1: document.getElementById("count1"),
        count2: document.getElementById("count2"),
      };

      const state = {
        options1: [], // [{ id, nombre }]
        options2: [], // [{ id, nombre }]
        assigned1: new Set(),
        assigned2: new Set(),
        ts1: null,
        ts2: null,
      };

      function setBusy(on) {
        if (on) {
          __busyCount++;
          if (__busyCount === 1) safeBlock();
        } else {
          __busyCount = Math.max(0, __busyCount - 1);
          if (__busyCount === 0) safeUnblock();
        }

        el.btnReload.classList.toggle("disabled", __busyCount > 0);
        el.select1.disabled = __busyCount > 0;
        el.select2.disabled = __busyCount > 0;

        if (state.ts1) (__busyCount > 0 ? state.ts1.disable() : state.ts1.enable());
        if (state.ts2) (__busyCount > 0 ? state.ts2.disable() : state.ts2.enable());
      }

      async function fetchAny(url) {
        const res = await fetch(url);
        const raw = await res.text();

        const tryParse = (txt) => {
          const t = (txt || "").trim().replace(/^\uFEFF/, "");
          if (!t) return null;
          if (t[0] !== "{" && t[0] !== "[") return null;
          try { return JSON.parse(t); } catch (_) { return null; }
        };

        if (!res.ok) throw new Error(`HTTP ${res.status} :: ${raw.slice(0, 300)}`);

        const parsed = tryParse(raw);
        return parsed !== null ? parsed : raw;
      }

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function normalizeText(v) {
        return String(v ?? "").trim();
      }

      function normalizeKey(v) {
        return normalizeText(v).toUpperCase();
      }

      function uniqSortedObjectsByName(arr) {
        const map = new Map();

        arr.forEach(item => {
          if (!item || typeof item !== "object") return;

          const nombre = normalizeText(item.nombre);
          if (!nombre) return;

          const key = normalizeKey(nombre);

          if (!map.has(key)) {
            map.set(key, {
              id: item.id ?? "",
              nombre,
              codigo: item.codigo ?? ""
            });
          }
        });

        return Array.from(map.values()).sort((a, b) =>
          a.nombre.localeCompare(b.nombre, "es", { sensitivity: "base" })
        );
      }

      function getRowId(r) {
        return (
          r.id ??
          r.ID ??
          r.Id ??
          r.llave ??
          r.key ??
          r.codigo ??
          r.Codigo ??
          r.valueId ??
          ""
        );
      }

      function getRowNombre(r) {
        return (
          r.descripcion_centrocosto ??
          r.text ??
          r.Nombre ??
          r.nombre ??
          r.name ??
          r.value ??
          r.label ??
          ""
        );
      }

      function normalizeOptions(json) {
        let rows = [];

        if (json && typeof json === "object" && Array.isArray(json.rows)) {
          rows = json.rows;
        } else if (Array.isArray(json)) {
          rows = json;
        } else if (json && typeof json === "object") {
          const arr = json.data || json.items || json.result || json.results;
          if (Array.isArray(arr)) rows = arr;
        }

        const normalized = rows.map(r => {
          if (!r) return null;

          if (typeof r === "string") {
            const nombre = normalizeText(r);
            if (!nombre) return null;
            return { id: "", nombre };
          }

          if (typeof r === "object") {
            if ("estado" in r && r.estado === false) return null;

            const nombre = normalizeText(getRowNombre(r));
            if (!nombre) return null;

            return {
              id: normalizeText(getRowId(r)),
              nombre
            };
          }

          return null;
        }).filter(Boolean);

        return uniqSortedObjectsByName(normalized);
      }

      function parseAsignaciones(json) {
        const out = { cc1: [], cc2: [] };

        const pushRow = (r) => {
          if (!r || typeof r !== "object") return;

          const tipo = Number(r.Tipo ?? r.tipo ?? r.type);
          const nombre = normalizeText(
            r.Nombre ??
            r.nombre ??
            r.descripcion_centrocosto ??
            r.text ??
            r.name ??
            r.value ??
            ""
          );
          const id = normalizeText(
            r.id ??
            r.ID ??
            r.Id ??
            r.llave ??
            r.key ??
            ""
          );
          const codigo = String(r.codigo ?? r.Codigo ?? "");

          if (!nombre) return;

          const item = { id, nombre, codigo };

          if (tipo === 1) out.cc1.push(item);
          if (tipo === 2) out.cc2.push(item);
        };

        if (json && typeof json === "object" && Array.isArray(json.rows)) {
          json.rows.forEach(pushRow);
        } else if (Array.isArray(json)) {
          json.forEach(pushRow);
        }

        return {
          cc1: uniqSortedObjectsByName(out.cc1),
          cc2: uniqSortedObjectsByName(out.cc2)
        };
      }

      async function loadOptions(tipo) {
        const url = `${baseUrl}/4DACTION/${tipo === 1
            ? "_V3_getAreasNegocio?page=1&results=5000&q=&q2=&activo=true"
            : "_force_getItemsNv?unicos=true"
          }`;

        const json = await fetchAny(url);
        const list = normalizeOptions(json);

        if (tipo === 1) state.options1 = list;
        else state.options2 = list;
      }

      function buildSelect(tipo) {
        const select = tipo === 1 ? el.select1 : el.select2;
        const full = tipo === 1 ? state.options1 : state.options2;
        const assignedUpper = tipo === 1 ? state.assigned1 : state.assigned2;

        const available = full.filter(item => !assignedUpper.has(normalizeKey(item.nombre)));

        select.innerHTML = `<option value=""></option>`;

        available.forEach(item => {
          const op = document.createElement("option");
          op.value = item.nombre;
          op.textContent = item.nombre;
          op.dataset.idCentroCosto = item.id || "";
          select.appendChild(op);
        });

        select.value = "";
      }

      function rowHTML(item, tipo) {
        const nombre = item?.nombre ?? "";
        const id = item?.id ?? "";
        const codigo = item?.codigo ?? "";
        const safe = escapeHtml(nombre);
        const dataNombre = encodeURIComponent(nombre);
        const dataId = encodeURIComponent(id);

        return `
        <div class="row">
          <div class="rowName" title="${safe}">${safe}</div>
          <input
            type="text"
            class="codigoInput"
            placeholder="Código"
            value="${escapeHtml(codigo)}"
            data-tipo="${tipo}"
            data-id="${dataId}"
            data-nombre="${dataNombre}"
            data-original="${escapeHtml(codigo)}"
          >
          <button
            class="xbtn"
            type="button"
            data-tipo="${tipo}"
            data-id="${dataId}"
            data-nombre="${dataNombre}"
            aria-label="Eliminar ${safe}"
          >×</button>
        </div>
      `;
      }

      async function updateCentroCosto({ tipo, nombre, idCentroCosto, accion, codigo }) {
        const params = {
          tipo: String(tipo),
          nombre: String(nombre),
          accion: String(accion),
          idCentroCosto: String(idCentroCosto ?? "")
        };
        if (codigo !== undefined) params.codigo = String(codigo);

        const qs = new URLSearchParams(params);
        const url = `${baseUrl}/4DACTION/_V3_updateCentroCostos?${qs.toString()}`;
        return fetchAny(url);
      }

      function destroyTomSelect() {
        if (state.ts1) { state.ts1.destroy(); state.ts1 = null; }
        if (state.ts2) { state.ts2.destroy(); state.ts2 = null; }

        if (el.select1 && el.select1.tomselect) el.select1.tomselect = null;
        if (el.select2 && el.select2.tomselect) el.select2.tomselect = null;
      }

      function initTomSelect(tipo) {
        const select = tipo === 1 ? el.select1 : el.select2;
        const assignedUpper = tipo === 1 ? state.assigned1 : state.assigned2;

        const ts = new TomSelect(select, {
          maxItems: 1,
          create: function (input, cb) {
            const nombre = normalizeText(input).toUpperCase();
            if (!nombre) return cb();

            cb({
              value: nombre,
              text: nombre,
              idCentroCosto: ""
            });
          },
          createOnBlur: true,
          placeholder: "Escribe para buscar…",
          persist: false,
          allowEmptyOption: true,
          valueField: "value",
          labelField: "text",
          searchField: ["text"],
          sortField: [{ field: "text", direction: "asc" }],
          plugins: ["remove_button"],
          render: {
            no_results: function () {
              return `<div class="no-results">No se han encontrado resultados</div>`;
            },
          },
          createFilter: function (input) {
            const v = normalizeText(input);
            if (!v) return false;

            const key = normalizeKey(v);

            if (assignedUpper.has(key)) return false;

            const opts = this.options || {};
            for (const k in opts) {
              const t = normalizeKey(opts[k]?.text || "");
              if (t === key) return false;
            }

            return true;
          },
          onChange: async function (value) {
            const nombre = normalizeText(value);
            if (!nombre) return;

            let idCentroCosto = "";

            if (this.options?.[value]?.idCentroCosto) {
              idCentroCosto = normalizeText(this.options[value].idCentroCosto);
            } else {
              const optionEl = Array.from(select.options).find(op => op.value === value);
              if (optionEl?.dataset?.idCentroCosto) {
                idCentroCosto = normalizeText(optionEl.dataset.idCentroCosto);
              }
            }

            setBusy(true);
            try {
              await updateCentroCosto({
                tipo,
                nombre,
                idCentroCosto,
                accion: "add"
              });
              await reloadAll();
            } catch (err) {
              console.error(err);
            } finally {
              setBusy(false);
            }
          }
        });

        ts.clear(true);
        return ts;
      }

      async function reloadAll() {
        setBusy(true);
        try {
          const asigUrl = `${baseUrl}/4DACTION/_V3_getCentroCostos`;
          const asigJson = await fetchAny(asigUrl);
          const parsed = parseAsignaciones(asigJson);

          state.assigned1 = new Set(parsed.cc1.map(x => normalizeKey(x.nombre)));
          state.assigned2 = new Set(parsed.cc2.map(x => normalizeKey(x.nombre)));

          await Promise.all([loadOptions(1), loadOptions(2)]);

          el.count1.textContent = parsed.cc1.length;
          el.count2.textContent = parsed.cc2.length;

          el.list1.innerHTML = parsed.cc1.length
            ? parsed.cc1.map(item => rowHTML(item, 1)).join("")
            : `<div class="empty">Sin asignaciones.</div>`;

          el.list2.innerHTML = parsed.cc2.length
            ? parsed.cc2.map(item => rowHTML(item, 2)).join("")
            : `<div class="empty">Sin asignaciones.</div>`;

          destroyTomSelect();
          buildSelect(1);
          buildSelect(2);

          state.ts1 = initTomSelect(1);
          state.ts2 = initTomSelect(2);
        } catch (err) {
          console.error(err);
        } finally {
          setBusy(false);
        }
      }

      el.btnReload.addEventListener("click", reloadAll);

      async function saveCodigo(input) {
        const tipo = Number(input.getAttribute("data-tipo"));
        const nombre = decodeURIComponent(input.getAttribute("data-nombre") || "");
        const idCentroCosto = decodeURIComponent(input.getAttribute("data-id") || "");
        const codigo = input.value.trim();
        const original = input.getAttribute("data-original") || "";

        if (codigo === original) return;

        setBusy(true);
        try {
          await updateCentroCosto({ tipo, nombre, idCentroCosto, accion: "update", codigo });
          input.setAttribute("data-original", codigo);
        } catch (err) {
          console.error(err);
          input.value = original;
        } finally {
          setBusy(false);
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const input = e.target.closest(".codigoInput");
        if (!input) return;
        e.preventDefault();
        input.blur();
      });

      document.addEventListener("focusout", async (e) => {
        const input = e.target.closest(".codigoInput");
        if (!input) return;
        await saveCodigo(input);
      });

      document.addEventListener("click", async (e) => {
        const btn = e.target.closest(".xbtn");
        if (!btn) return;

        const tipo = Number(btn.getAttribute("data-tipo"));
        const nombre = decodeURIComponent(btn.getAttribute("data-nombre") || "");
        const idCentroCosto = decodeURIComponent(btn.getAttribute("data-id") || "");

        if (!nombre || ![1, 2].includes(tipo)) return;

        setBusy(true);
        try {
          await updateCentroCosto({
            tipo,
            nombre,
            idCentroCosto,
            accion: "delete"
          });
          await reloadAll();
        } catch (err) {
          console.error(err);
        } finally {
          setBusy(false);
        }
      });

      safeBlock();
      reloadAll();
    })();
  </script>
</body>

</html>
